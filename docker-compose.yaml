services:
  telegram-stremio:
    build: .
    container_name: tg_stremio
    ports:
      - "127.0.0.1:${PORT:-8000}:${PORT:-8000}"
    volumes:
      - ./config.env:/app/config.env
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "3"
